crons:
  - name: daily-flood-check
    description: "Re-scans every monitored field each morning and emails new-water flood alerts"
    cron: "30 1 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-flood-check"
    method: POST
    enabled: true
